name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no step here writes to the repository.
permissions:
  contents: read

# A new push to a PR supersedes its running checks; every main commit still
# gets a full run so the history stays bisectable.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bsd_test
          POSTGRES_PASSWORD: bsd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6; pnpm version comes from packageManager in package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Known vulnerabilities in the lockfile fail the build; Dependabot
      # opens the fix, this makes sure it is not left waiting.
      - name: Audit dependencies
        run: |
          pnpm audit --audit-level=high
          pnpm --dir workers/postmark-inbound audit --audit-level=high
          pnpm --dir workers/pics-guard audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Authorization regression check
        run: pnpm check-authz

      - name: Migration drift check
        run: pnpm check-migrations

      - name: Unit and integration tests
        run: pnpm test
        env:
          TEST_PG_URL: postgres://bsd_test:bsd_test@localhost:5432

      - name: Postmark inbound Worker (types + tests)
        run: |
          pnpm worker:install
          pnpm worker:check-types
          pnpm worker:test

      - name: Pics guard Worker (types + tests)
        run: |
          pnpm pics-guard:install
          pnpm pics-guard:check-types
          pnpm pics-guard:test

      - name: Build
        run: pnpm build
        env:
          # The marketing pages statically prerender at build time and query
          # the DB, so the build needs a migrated database — reuse the test
          # template built by the integration suite.
          DATABASE_URL: postgres://bsd_test:bsd_test@localhost:5432/bsd_test_template

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bsd_test
          POSTGRES_PASSWORD: bsd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create e2e database
        run: PGPASSWORD=bsd_test psql -h localhost -U bsd_test -d postgres -c "CREATE DATABASE bsd_e2e"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgres://bsd_test:bsd_test@localhost:5432/bsd_e2e
          E2E_BASE_URL: http://localhost:3100
          BETTER_AUTH_SECRET: e2e-ci-secret-not-used-anywhere-real
          SQUARE_ENVIRONMENT: sandbox

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
